name: Provision Demo Users (UAT Only)

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Ambiente permitido (restringido exclusivamente a uat)'
        required: true
        default: uat
        type: choice
        options:
          - uat
      confirm:
        description: 'Escribe PROVISION_UAT para confirmar'
        required: true
        type: string
      supervisor_username:
        description: Usuario para Supervisor de Extrusión
        required: true
        type: string
      supervisor_email:
        description: Correo para Supervisor de Extrusión
        required: true
        type: string
      global_username:
        description: Usuario para el administrador global de demostración
        required: true
        type: string
      global_email:
        description: Correo para el administrador global de demostración
        required: true
        type: string
      global_role_code:
        description: Código del rol global existente
        required: true
        default: ADMIN_GRAL
        type: choice
        options:
          - ADMIN_GRAL
          - ADMIN_GENERAL

permissions:
  contents: read

jobs:
  provision:
    if: github.event.inputs.target_environment == 'uat' && github.event.inputs.confirm == 'PROVISION_UAT'
    environment: uat
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create demo accounts in UAT
        run: node src/scripts/provision-demo-users.js
        env:
          APP_ENV: uat
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEMO_SUPERVISOR_USERNAME: ${{ inputs.supervisor_username }}
          DEMO_SUPERVISOR_EMAIL: ${{ inputs.supervisor_email }}
          DEMO_SUPERVISOR_PASSWORD: ${{ secrets.DEMO_SUPERVISOR_PASSWORD }}
          DEMO_GLOBAL_USERNAME: ${{ inputs.global_username }}
          DEMO_GLOBAL_EMAIL: ${{ inputs.global_email }}
          DEMO_GLOBAL_PASSWORD: ${{ secrets.DEMO_GLOBAL_PASSWORD }}
          DEMO_GLOBAL_ROLE_CODE: ${{ inputs.global_role_code }}
