name: Seed Catalog Data (Controlled)

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Ambiente de pruebas del cliente (UAT)'
        required: true
        default: 'uat'
        type: choice
        options:
          - uat
      confirm:
        description: 'Escribe "SEED_CONFIRMADO" para confirmar la carga idempotente de catálogos'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  seed-catalogs:
    name: Seed Catalogs -> ${{ inputs.target_environment }}
    environment: ${{ inputs.target_environment }}
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm == 'SEED_CONFIRMADO' }}
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate DB connection (pre-check)
        run: node src/scripts/validate-migration.js
        env:
          APP_ENV: ${{ inputs.target_environment }}
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run pending migrations first
        run: npx sequelize-cli db:migrate --env ${{ inputs.target_environment }}
        env:
          APP_ENV: ${{ inputs.target_environment }}
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Seed catalog data
        run: npx sequelize-cli db:seed --seed 20260826120000-production-catalog-data.js --env ${{ inputs.target_environment }}
        env:
          APP_ENV: ${{ inputs.target_environment }}
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Verify seeded rows (spot-check)
        run: node src/scripts/verify-catalog-seed.js
        env:
          APP_ENV: ${{ inputs.target_environment }}
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Verify client operational catalogs
        run: node src/scripts/verify-client-area-catalogs.js
        env:
          APP_ENV: ${{ inputs.target_environment }}
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
