name: Database Rollback (Controlled)

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Ambiente donde se revertirá la migración (uat o production)'
        required: true
        default: 'uat'
        type: choice
        options:
          - uat
          - production
      step:
        description: 'Número de pasos a revertir (1 para la última migración)'
        required: true
        default: '1'
        type: string
      confirm:
        description: 'Escribe CONFIRMAR_ROLLBACK para proceder'
        required: true
        type: string

permissions:
  contents: read

jobs:
  rollback:
    environment: ${{ inputs.target_environment }}
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'CONFIRMAR_ROLLBACK'
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate rollback depth
        run: |
          if ! [[ "$STEPS" =~ ^[1-9][0-9]?$ ]] || [ "$STEPS" -gt 10 ]; then
            echo "Rollback depth must be an integer from 1 to 10."
            exit 1
          fi
        env:
          STEPS: ${{ github.event.inputs.step }}

      - name: Run rollback (Undo)
        run: |
          echo "Revertiendo ${STEPS} migración(es) en ${APP_ENV}..."
          for i in $(seq 1 $STEPS); do
            npx sequelize-cli db:migrate:undo --env ${APP_ENV}
          done
        env:
          APP_ENV: ${{ inputs.target_environment }}
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STEPS: ${{ github.event.inputs.step }}
